
[workspace]
members = ['libs/copper', 'apps/glowsquid']
resolver = "2"

[workspace.dependencies]
serde_json = "1.0.114"
serde = { version = "1.0.197", features = ["derive"] }

reqwest = { version = "0.12.4", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }

error-stack = { version = "0.4.1", features = ["spantrace", "serde"] }

oauth2 = "4.4.2"

[profile.release]
lto = true
