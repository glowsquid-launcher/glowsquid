
[workspace]
members = ['libs/copper', 'apps/glowsquid', 'libs/tauri-plugin-state']
resolver = "2"

[workspace.dependencies]
serde_json = "1.0.114"
serde = { version = "1.0.197", features = ["derive"] }
oauth2 = "4.4.2"

specta = { version = "=2.0.0-rc.12", features = [
    "serde",
    "serde_json",
    "typescript",
] }
tauri-specta = { version = "=2.0.0-rc.11", features = [
    "javascript",
    "typescript",
] }

reqwest = { version = "0.12.5", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }

chrono = { version = "0.4.38", default-features = false, features = [
    "std",
    "serde",
] }

error-stack = { version = "0.4.1", features = ["spantrace", "serde"] }

[profile.release]
lto = true
