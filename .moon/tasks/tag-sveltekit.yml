$schema: "https://moonrepo.dev/schemas/tasks.json"

fileGroups:
    sources:
        - "src/**/*"
        - "static/**/*"
    tests:
        - "tests/**/*"

tasks:
    dev:
        command: "vite dev"
        deps:
            - "^:dev"
        local: true
    preview:
        command: "vite preview"
        deps:
            - build
            - "^:build"
            - "^:preview"
        local: true
    build:
        command: "vite build"
        deps:
            - ^:build
        inputs:
            - "@globs(sources)"
        outputs:
            - "dist"
    check:
        command: "svelte-check --tsconfig ./tsconfig.json"
        inputs:
            - "@globs(sources)"
        deps:
            - sync
    sync:
        command: "svelte-kit sync"
        inputs:
            - "@globs(sources)"
