$schema: 'https://moonrepo.dev/schemas/tasks.json'

tasks:
  test:
    command: 'cargo nextest run'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
  coverage:
    command: 'cargo llvm-cov nextest --all-features --workspace --codecov --output-path codecov.json'
    deps:
      - build
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
    outputs:
      - 'codecov.json'
