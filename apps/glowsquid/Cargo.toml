[package]
name = "glowsquid"
version = "0.0.0"
description = "Next-gen hyperspeed Minecraft launcher"
authors = ["Suyashtnt <suyashtnt@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0.0-beta", features = [] }

[dependencies]
tauri = { version = "=2.0.0-beta.22", features = [] }
copper = { path = "../../libs/copper" }

serde.workspace = true
serde_json.workspace = true

oauth2.workspace = true
error-stack.workspace = true
reqwest.workspace = true

rusqlite = { version = "0.31.0", features = ["bundled"] }
rusqlite_migration = { version = "1.2.0", features = [
    "alpha-async-tokio-rusqlite",
] }
tokio-rusqlite = "0.5.1"
once_cell = "1.19.0"
axum = "0.7.5"
tokio = "1.38.0"
open = "5.1.4"
specta = { version = "=2.0.0-rc.12", features = ["serde", "serde_json", "typescript"] }
tauri-specta = { version = "=2.0.0-rc.11", features = ["javascript", "typescript"] }


[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
