$schema: "https://moonrepo.dev/schemas/project.json"

fileGroups:
    sources:
        - "src/**/*"
        - "icons/**/*"
        - "tauri.conf.json"
        - "Cargo.toml"

project:
    name: Glowsquid
    description: Tauri code and actual app for Glowsquid

type: application
stack: frontend
language: rust
platform: rust

tasks:
    dev:
        command: noop
        deps:
            - prepare
            - dev-tauri
            - ^:dev
        local: true
    dev-tauri:
        command: "cargo tauri dev"
        local: true
    build:
        command: "tauri build"
        deps:
            - prepare
            - ^:build
        outputs:
            - "/target/release/glowsquid*"
            - "!/target/release/glowsquid.d"
            - "!/target/release/glowsquid.pdb"
            - "/target/release/bundle/**/*"
        options:
            mergeArgs: "replace"
    coverage:
        deps:
            # tauri proc macro moment
            - glowsquid-frontend:build
    prepare:
        command: "npx zx setup-db.js"
        options:
            cache: false

tags:
    - tauri

dependsOn:
    - glowsquid-frontend
