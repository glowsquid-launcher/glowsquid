$schema: "https://moonrepo.dev/schemas/project.json"

project:
    name: Tauri Plugin State
    description: Simple yet effective state management for Tauri apps

type: library
stack: frontend
language: typescript
platform: node

tasks:
    build:
        command: "pnpm rollup -c"
        inputs:
            - rollup.config.js
            - guest-js
    dev:
        command: "pnpm rollup -c -w"
        local: true
    test:
        command: noop
        deps:
            - test-doctest
            - test-nextest
            - test-js
    test-js:
        command: noop
        inputs:
            - rollup.config.js
            - guest-js
        deps:
            - build
    test-doctest:
        command: "cargo test --doc"
        inputs:
            - src
            - Cargo.toml
    test-nextest:
        command: "cargo nextest run"
        inputs:
            - src
            - Cargo.toml
    release:
        command: noop
        deps:
            - publish-npm
            - publish-crate
    publish-npm:
        command: "pnpm publish"
        deps:
            - build
    publish-crate:
        command: "cargo publish"
