[package]
name = "tauri-plugin-state"
version = "0.1.0"
authors = ["Suyashtnt <Suyashtnt@gmail.com>"]
description = "Dead simple state management for tauri"
license = "MIT"
homepage = "https://github.com/glowsquid-launcher/glowsquid/tree/dev/libs/tauri-plugin-state"
repository = "https://github.com/glowsquid-launcher/glowsquid"
documentation = "https://docs.rs/tauri-plugin-state"
edition = "2021"
rust-version = "1.70"
exclude = ["/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-state"

[dependencies]
tauri = { version = "=2.0.0-beta.22", features = [] }
specta.workspace = true
tauri-specta.workspace = true
serde.workspace = true
thiserror = "1.0"
tokio = "1.38.0"

[build-dependencies]
tauri-plugin = { version = "2.0.0-beta.17", features = ["build"] }
