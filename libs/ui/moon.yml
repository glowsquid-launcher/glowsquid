$schema: 'https://moonrepo.dev/schemas/project.json'

project:
  name: UI
  description: Common UI components and utilities

type: library
stack: frontend
language: typescript
platform: node

tasks:
  test:
    command: pnpm vitest run
    inputs:
      - src/**/*.ts
      - vitest.config.ts
      - package.json
  coverage:
    command: pnpm vitest run --coverage
    inputs:
      - src/**/*.ts
      - vitest.config.ts
      - package.json
    outputs:
      - coverage/
